<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>효소에 빠져버렸어...</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#173e54;--muted:#607d91;--pink:#f29fbd;--line:#c9e4f2;--paper:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Gowun Dodum',sans-serif;background:linear-gradient(135deg,#f2fbff,#dff4ff 48%,#cceaff)}button,input{font:inherit}.display{font-family:'Gaegu',cursive}.wrap{max-width:1100px;margin:auto;padding:24px 18px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.title{font-size:clamp(30px,5vw,48px);margin:0;text-align:center}.score{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;white-space:nowrap}.intro{text-align:center;color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.enzyme{min-height:118px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.88);padding:16px 10px;box-shadow:0 8px 22px #2b729014;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink)}.enzyme:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 12px 24px #2b729020}.emoji{font-size:28px}.enzyme-name{font-size:clamp(14px,2vw,18px);font-weight:bold;text-align:center;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted)}.panel{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 16px 48px #173e3412}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pill{border-radius:999px;background:#e9f7ff;padding:8px 12px;font-size:14px}.question{font-size:clamp(20px,3vw,27px);line-height:1.5;margin:8px 0 22px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;cursor:pointer}.choice:hover:not(:disabled){border-color:var(--pink)}.choice.selected{border-color:var(--ink);background:#eaf7ff}.choice:disabled{cursor:default}.short{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px}.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--ink);color:#fff;cursor:pointer}.btn.secondary{background:#eaf7ff;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.feedback{margin-top:18px;padding:14px;border-radius:14px;background:#f1faff}.result{text-align:center;padding:18px 0}.result h2{font-size:30px}.footer{text-align:center;color:var(--muted);margin:28px 0 0;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.enzyme{min-height:105px}.top{flex-direction:column}.title{order:-1}.wrap{padding:18px 12px 26px}}@media(min-width:651px) and (max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}}
</style></head><body><div class="wrap">
<header class="top"><div class="score">현재 호감도 <strong id="totalScore">0</strong></div><h1 class="title display">효소에 빠져버렸어...</h1><div class="pill" id="progressTop">효소 선택</div></header>
<section id="home"><p class="intro">오늘은 어떤 효소와 가까워질까? 마음에 드는 효소를 선택해 퀴즈를 시작해 봐!</p><div class="grid" id="enzymeGrid"></div></section>
<section id="quiz" class="panel hidden"><div class="row"><button class="btn secondary" id="homeBtn">← 효소 선택</button><span class="pill" id="progress">1 / 7</span></div><div class="pill" id="currentEnzyme"></div><h2 class="question" id="questionText"></h2><div id="choices" class="choices"></div><form id="shortForm" class="hidden"><input id="shortAnswer" class="short" autocomplete="off" placeholder="정답을 입력해 줘"></form><div id="feedback" class="feedback hidden" role="status"></div><div class="actions"><span class="pill" id="questionHint">정답을 맞히면 +10점!</span><button class="btn" id="submitBtn">답 확인하기</button><button class="btn hidden" id="nextBtn">다음 문제 →</button></div></section>
<section id="result" class="panel hidden"><div class="result"><div style="font-size:44px">💗</div><h2 class="display">퀴즈 완료!</h2><p id="resultCount"></p><p id="resultScore"></p><div class="actions" style="justify-content:center"><button class="btn" id="retryBtn">같은 효소 다시 도전</button><button class="btn secondary" id="resultHomeBtn">다른 효소 선택</button></div></div></section>
<footer class="footer">정답을 맞힐수록 가까워지는 그와 나의 최종 반응.</footer></div>
<script>
const common=[
{q:'효소가 생명체 내 화학 반응을 촉진하는 주된 원리는?',o:['반응의 활성화 에너지를 낮춘다.','반응물의 양을 항상 증가시킨다.','반응의 반응열을 낮춘다.','반응 후 생성물을 모두 분해한다.'],a:0},
{q:'효소의 기질 특이성을 가장 잘 설명한 것은?',o:['모든 효소가 모든 기질과 결합한다.','효소는 입체 구조와 화학적 성질이 맞는 기질에 선택적으로 작용한다.','기질의 종류와 관계없이 반응 속도는 같다.','효소는 반응이 끝나면 반드시 소모된다.'],a:1},
{q:'감자즙에 과산화 수소를 넣었을 때 거품이 발생했다. 이때 거품의 주된 구성 성분은?',o:['질소','수소','산소','이산화탄소'],a:2},
{q:'효소는 반응이 끝난 뒤에도 다른 기질과 결합해 반복적으로 작용할 수 있다.',o:['참','거짓'],a:0},
{q:'효소가 있으면 화학 반응의 평형이 항상 생성물 쪽으로 이동한다.',o:['참','거짓'],a:1},
{q:'DNA 전기영동에서 DNA 조각이 이동하는 주된 원리는 무엇일까?',o:['DNA가 열에 의해 끓으면서 이동한다.','전기장 속에서 DNA 전하에 의해 이동한다.','DNA가 효소에 의해 모두 단백질로 변해 이동한다.','DNA 조각은 전하와 크기에 관계없이 같은 속도로 이동한다.'],a:1},
{q:'같은 조건에서 DNA 조각 2개를 전기영동했더니 조각 A가 조각 B보다 더 멀리 이동했다. 일반적인 아가로스 겔 전기영동에서 가장 적절한 해석은?',o:['A의 DNA에는 인산기가 없다.','A의 DNA 조각이 더 클 가능성이 높다.','A의 DNA 조각이 더 작을 가능성이 높다.'],a:2},
{q:'녹말 용액에 녹말 분해 효소가 들어 있는 소화제를 넣고 충분히 반응시킨 뒤 아이오딘 용액을 떨어뜨렸다. 예상되는 색 변화는?',o:['청람색으로 변한다.','황갈색을 유지한다.','붉은색으로 변한다.','보라색으로 변한다.'],a:1},
{q:'단백질 용액에 단백질 분해 효소가 들어 있지 않은 소화제를 넣고 충분히 반응시킨 뒤 뷰렛 용액을 떨어뜨렸다. 예상되는 색 변화는?',o:['청록색을 유지한다.','보라색으로 변한다.','노란색으로 변한다.','붉은색으로 변한다.'],a:1}
];
const enzymes=[
{id:'topoisomerase',name:'토포이소머레이스',emoji:'🧬',qs:[{q:'토포이소머레이스의 역할은 무엇일까요?',o:['DNA의 꼬임을 풀어 준다','유당을 포도당과 갈락토스로 분해한다','세균 세포벽을 분해한다','ATP를 합성한다'],a:0},{q:'DNA 복제 과정에서 토포이소머레이스가 필요한 이유는?',o:['새 뉴클레오타이드를 연결하기 위해','DNA가 풀릴 때 생기는 꼬임을 완화하기 위해','단백질을 분해하기 위해','세포벽을 강화하기 위해'],a:1}]},
{id:'helicase',name:'헬리케이스',emoji:'🌀',qs:[{q:'헬리케이스의 역할은 무엇일까요?',o:['단백질을 분해한다','DNA 이중나선의 두 가닥을 분리한다','유당을 분해한다','이산화탄소를 고정한다'],a:1},{q:'헬리케이스가 DNA 가닥을 분리할 때 사용하는 에너지원은?',o:['포도당','산소','ATP','이산화탄소'],a:2}]},
{id:'lysozyme',name:'라이소자임',emoji:'🛡️',qs:[{q:'라이소자임의 기질은 무엇일까요?',o:['DNA','세균의 세포벽 성분','유당','지방'],a:1},{q:'눈물과 침에 라이소자임이 존재하는 주된 이유는?',o:['소화를 돕기 위해','에너지를 만들기 위해','세균으로부터 몸을 보호하는 데 도움을 주기 위해','DNA 복제를 촉진하기 위해'],a:2}]},
{id:'protease',name:'프로테아제',emoji:'✂️',qs:[{q:'프로테아제의 역할은 무엇일까요?',o:['단백질을 분해한다','DNA를 푼다','ATP를 합성한다','세포벽을 분해한다'],a:0},{q:'단백질 용액에 프로테아제가 작용하면 어떤 변화가 일어날까요?',o:['단백질이 분해된다','유당이 만들어진다','DNA 가닥이 분리된다','이산화탄소가 포도당으로 바뀐다'],a:0}]},
{id:'rubisco',name:'루비스코',emoji:'🌿',qs:[{q:'루비스코가 관여하는 생물학적 과정은?',o:['소화','광합성','DNA 복제','세균 세포벽 분해'],a:1},{q:'루비스코의 역할로 가장 알맞은 것은?',o:['광합성에서 CO₂가 유기 분자 합성에 이용되도록 돕는다','유당을 분해한다','DNA 가닥을 분리한다','단백질을 아미노산으로 분해한다'],a:0}]},
{id:'dna-polymerase',name:'DNA 중합효소',emoji:'🧩',qs:[{q:'DNA 중합효소의 역할은 무엇일까요?',o:['DNA를 푼다','새로운 DNA 가닥을 합성한다','세포벽을 분해한다','ATP를 직접 합성한다'],a:1},{q:'DNA 중합효소가 제대로 작동하지 않으면 어떤 일이 일어날까요?',o:['새 DNA 가닥의 합성이 방해된다','유당 분해가 빨라진다','세포벽이 자동으로 분해된다','광합성이 반드시 증가한다'],a:0}]},
{id:'lactase',name:'락타아제',emoji:'🥛',qs:[{q:'락타아제의 기질은 무엇일까요?',o:['단백질','녹말','유당','DNA'],a:2},{q:'락타아제가 유당을 분해하면 무엇이 생성될까요?',o:['포도당과 갈락토스','포도당과 아미노산','지방산과 글리세롤','이산화탄소와 산소'],a:0}]},
{id:'atp-synthase',name:'ATP 합성효소',emoji:'⚡',qs:[{q:'ATP 합성효소의 주요 역할은?',o:['단백질 분해','ATP 합성','DNA 분리','세포벽 분해'],a:1},{q:'미토콘드리아의 ATP 합성효소가 이용하는 것은?',o:['DNA 염기서열','유당 분해에서만 얻는 에너지','양성자 농도 기울기','세균 세포벽'],a:2}]}
];
let active=null, pool=[],idx=0,score=0,correct=0,selected=null,answered=false,totalScore=0;
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function renderGrid(){$('enzymeGrid').innerHTML='';enzymes.forEach(e=>{const b=document.createElement('button');b.className='enzyme';b.innerHTML=`<span class="emoji">${e.emoji}</span><span class="enzyme-name">${e.name}</span><span class="sub">퀴즈 시작하기 ♥</span>`;b.onclick=()=>start(e);$('enzymeGrid').appendChild(b);});}
function start(e){active=e;score=0;correct=0;idx=0;pool=shuffle([...e.qs,...shuffle(common).slice(0,5)]);pool=shuffle(pool);$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('currentEnzyme').textContent=e.emoji+' '+e.name+' 공략 중';renderQ();}
function renderQ(){selected=null;answered=false;const q=pool[idx];$('progress').textContent=`${idx+1} / ${pool.length}`;$('progressTop').textContent=`${idx+1} / ${pool.length}`;$('questionText').textContent=q.q;$('feedback').classList.add('hidden');$('submitBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');$('shortForm').classList.toggle('hidden',!q.short);$('choices').classList.toggle('hidden',!!q.short);$('choices').innerHTML='';$('shortAnswer').value='';$('shortAnswer').disabled=false;if(!q.short)q.o.forEach((option,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>{if(answered)return;selected=i;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');};$('choices').appendChild(b);});$('totalScore').textContent=totalScore+score;}
function norm(s){return String(s).normalize('NFC').trim().toLocaleLowerCase('ko-KR').replace(/\s+/g,'');}
function submit(){if(answered)return;const q=pool[idx];let ok=false;if(q.short){const r=$('shortAnswer').value.trim();if(!r){$('feedback').textContent='정답을 입력해 줘!';$('feedback').classList.remove('hidden');return;}ok=norm(r)===norm(q.a)||(q.a==='o'&&['o','참','맞다','맞습니다'].includes(norm(r)));}else{if(selected===null){$('feedback').textContent='선택지를 골라 줘!';$('feedback').classList.remove('hidden');return;}ok=selected===q.a;}answered=true;if(ok){score+=10;correct++;}else score-=10;$('totalScore').textContent=totalScore+score;$('feedback').textContent=ok?'정답이야! 호감도 +10 💗':`아쉽다! 정답은 ${q.short?q.a:String.fromCharCode(65+q.a)+'. '+q.o[q.a]} 이야.`;$('feedback').classList.remove('hidden');$('submitBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');[...$('choices').children].forEach(b=>b.disabled=true);$('shortAnswer').disabled=true;$('nextBtn').textContent=idx===pool.length-1?'결과 보기 ♥':'다음 문제 →';}
function next(){if(!answered)return;if(idx<pool.length-1){idx++;renderQ();}else finish();}
function finish(){$('totalScore').textContent='0';totalScore=0;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('progressTop').textContent='퀴즈 완료';$('resultCount').textContent=`총 ${pool.length}문제 중 ${correct}문제 정답`;$('resultScore').textContent=`이번 퀴즈 호감도 ${score}점`;$('retryBtn').onclick=()=>start(active);}
function home(){ $('quiz').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');$('progressTop').textContent='효소 선택'; }
$('submitBtn').onclick=submit;$('nextBtn').onclick=next;$('homeBtn').onclick=home;$('resultHomeBtn').onclick=home;$('shortForm').addEventListener('submit',e=>{e.preventDefault();submit();});renderGrid();
</script></body></html>
